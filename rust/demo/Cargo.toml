[package]
name = "tinyeasings-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "CC0-1.0"

[features]
screenshot = ["eframe/__screenshot"]

[dependencies]
tinyeasings = { path = ".." }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Location", "UrlSearchParams", "Performance", "Blob", "Url", "HtmlAnchorElement"] }

[profile.release]
opt-level = 2

[workspace]
